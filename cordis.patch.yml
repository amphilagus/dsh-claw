# The dsh-claw bundle patch: insert home, uv-sandbox, and memory. The system
# sandbox-local provider stays; claw-home and uv-sandbox register extra writable
# roots through sandboxPolicy.grant(). memory only needs agents/tools first.
#
# User overlays belong in the profile's own cordis.patch.yml, addressed by id:
#   - id: claw-memory
#     config:
#       root: '~/.dsh/memories'
- insert:
    - id: claw-home
      name: '@deepseek-ai/dsh-claw/home'
    - id: uv-sandbox
      name: '@deepseek-ai/dsh-claw/uv'
    - id: claw-memory
      name: '@deepseek-ai/dsh-claw/memory'
